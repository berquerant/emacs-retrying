name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  actions-lock-verify:
    permissions:
      contents: read # checkout repository to verify actions.lock
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.9.1

  ci:
    permissions:
      contents: read # checkout repository for Emacs CI
    uses: berquerant/reusable-workflows/.github/workflows/emacs-ci.yml@v0.9.1
    with:
      emacs-versions: "27.1"
      test-command: bin/test.sh
